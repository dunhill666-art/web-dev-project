services:
  # ============================================================
  # AeroGlide Web Application (PHP 8.3 + Apache + Symfony 7.4 WebApp)
  # ============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeroglide_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: aeroglide
      DB_USER: aeroglide
      DB_PASSWORD: aeroglide_secret
      DATABASE_URL: "mysql://aeroglide:aeroglide_secret@db:3306/aeroglide?serverVersion=mariadb-10.11.0&charset=utf8mb4"
      APP_ENV: dev
      APP_SECRET: "4f8b2c1e7a903d6521e84c9f1a2b3c4d"
      DEFAULT_URI: "http://localhost:8080"
      TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR,private_ranges"
      TRUSTED_HOSTS: "^.*$"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: "null://null"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aeroglide_net

  # ============================================================
  # Dedicated Database Engine (MariaDB 10.11 LTS)
  # Persistent storage with automatic DDL and seed initialization
  # ============================================================
  db:
    image: mariadb:10.11
    container_name: aeroglide_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: aeroglide
      MYSQL_USER: aeroglide
      MYSQL_PASSWORD: aeroglide_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost -uroot -proot_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - aeroglide_net

  # ============================================================
  # phpMyAdmin Visual Database Administration GUI
  # Inspect tables, records, queries without CLI commands
  # ============================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: aeroglide_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_secret
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aeroglide_net

  # ============================================================
  # Optional: Ngrok Public Tunnel Service (Dockerized)
  # Launch with: docker compose --profile tunnel up -d
  # Requires NGROK_AUTHTOKEN in .env or shell environment
  # ============================================================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: aeroglide_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "web:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - web
    networks:
      - aeroglide_net
    profiles:
      - tunnel

# ============================================================
# Named Volumes & Isolated Bridge Network
# ============================================================
volumes:
  db_data:
    driver: local

networks:
  aeroglide_net:
    driver: bridge
